name: Terraform Deploy

on:
  push:
    branches: [dev, int, prod]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '**.md'
      - '.github/workflows/**'
  pull_request:
    branches: [dev, int, prod]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '**.md'
      - '.github/workflows/**'

env:
  AWS_REGION: af-south-1

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Set environment from branch
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "ENV=${BRANCH}" >> $GITHUB_ENV

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="values/${{ env.ENV }}/${{ env.ENV }}.tfbackend"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="values/${{ env.ENV }}/${{ env.ENV }}.tfvars"
