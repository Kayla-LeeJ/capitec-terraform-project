name: Terraform Deploy

on:
  pull_request:
    branches: [dev, int, prod]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
  push:
    branches: [dev, int, prod]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to target"
        required: true
        type: choice
        options: [dev, int, prod]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: af-south-1
  TF_VERSION: "~1.15"

permissions:
  contents: read

jobs:
  fmt:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: Plan (${{ matrix.env }})
    if: github.event_name == 'pull_request'
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, int, prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=values/${{ matrix.env }}/${{ matrix.env }}.tfbackend

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file=values/${{ matrix.env }}/${{ matrix.env }}.tfvars \
            -out=tfplan \
            -no-color
          terraform show -no-color tfplan > plan_output.txt

      - name: Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan
          retention-days: 7

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(0, 60000);
            const marker = `<!-- terraform-plan-${{ matrix.env }} -->`;
            const body = `${marker}\n### 📋 Terraform Plan — \`${{ matrix.env }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>\n\n**To apply:** Go to Actions → Run workflow → env: \`${{ matrix.env }}\` → action: \`apply\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Plan Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📋 Terraform Plan — `${{ matrix.env }}`
          > Review the plan output in the **Plan** step above, then approve via workflow dispatch.
          EOF

  apply:
    name: Apply (${{ github.ref_name }})
    if: github.event_name == 'push'
    needs: fmt
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: terraform-apply-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=values/${{ github.ref_name }}/${{ github.ref_name }}.tfbackend

      - name: Apply
        run: |
          terraform apply \
            -var-file=values/${{ github.ref_name }}/${{ github.ref_name }}.tfvars \
            -auto-approve \
            -no-color

  manual:
    name: Manual ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: terraform-apply-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config=values/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfbackend

      - name: Run
        run: |
          case "${{ github.event.inputs.action }}" in
            plan)
              terraform plan -var-file=values/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -no-color
              ;;
            apply)
              terraform apply -var-file=values/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -auto-approve -no-color
              ;;
            destroy)
              terraform destroy -var-file=values/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -auto-approve -no-color
              ;;
          esac

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${{ github.base_ref || github.ref_name }}"
          fi
          echo "ENV=${ENV}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="values/${{ env.ENV }}/${{ env.ENV }}.tfbackend"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file="values/${{ env.ENV }}/${{ env.ENV }}.tfvars"

      - name: Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: tfplan
          retention-days: 7

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Terraform Plan - ${{ env.ENV }}\n\n📋 Plan generated and ready for review.\n\n**To apply this plan:**\n1. Go to Actions → "Terraform Deploy"\n2. Click "Run workflow"\n3. Select environment: \`${{ env.ENV }}\`\n4. Select action: \`apply\`\n5. Click "Run workflow"\n\n[View Plan Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })

      - name: Create Plan Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📋 Terraform Plan Summary - ${{ env.ENV }}
          
          ### ✅ Plan Status: SUCCESS
          
          **Environment:** `${{ env.ENV }}`  
          **Triggered by:** ${{ github.event_name }}  
          **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})  
          
          ---
          
          ### 🚀 Next Steps
          
          #### To Apply Changes:
          1. Review the plan output in the **Terraform Plan** step above
          2. Go to **Actions** tab
          3. Click **"Run workflow"** button (top right)
          4. Select:
             - **Environment:** `${{ env.ENV }}`
             - **Action:** `apply`
          5. Click **"Run workflow"** (green button)
          6. **Approve** when prompted
          
          **Plan artifact saved:** `tfplan-${{ env.ENV }}` (7 days retention)
          
          ---
          
          > ⚠️ **Review the plan carefully before applying!**  
          > Look for unexpected resource changes, deletions, or modifications.
          
          EOF

  terraform-apply:
    name: Terraform Apply/Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Action and Environment
        run: |
          ENV="${{ github.event.inputs.environment }}"
          ACTION="${{ github.event.inputs.action }}"
          echo "ENV=${ENV}" >> $GITHUB_ENV
          echo "ACTION=${ACTION}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform Init
        run: terraform init -backend-config="values/${{ env.ENV }}/${{ env.ENV }}.tfbackend"

      - name: Download Plan Artifact
        if: env.ACTION == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENV }}
          path: ./
        continue-on-error: true

      - name: Check Plan Exists
        if: env.ACTION == 'apply'
        run: |
          if [ ! -f tfplan ]; then
            echo "⚠️  No plan artifact found. Running plan first..."
            terraform plan -out=tfplan -var-file="values/${{ env.ENV }}/${{ env.ENV }}.tfvars"
          fi

      - name: Terraform Apply
        if: env.ACTION == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: env.ACTION == 'destroy'
        run: terraform destroy -auto-approve -var-file="values/${{ env.ENV }}/${{ env.ENV }}.tfvars"
